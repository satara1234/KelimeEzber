<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>SRS Kelime Ezberleme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fireAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-scale-in { animation: scaleIn 0.3s ease-out; }
        .animate-fire { animation: fireAnimation 0.5s ease-in-out; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0); }
        button:active { transform: scale(0.97); }
        .speak-btn:active { transform: scale(0.9); }
        .word-card:active { transform: scale(0.98); }
        .modal-overlay { backdrop-filter: blur(8px); }
        .progress-ring { transition: stroke-dashoffset 0.5s ease; }

        .dark-theme { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .dark-theme .bg-white, .dark-theme .bg-white\/90, .dark-theme .bg-white\/80 { background-color: rgba(30, 30, 46, 0.95) !important; color: #e0e0e0 !important; }
        .dark-theme .text-gray-800, .dark-theme .text-gray-700, .dark-theme .text-gray-600 { color: #e0e0e0 !important; }
        .dark-theme .text-gray-500, .dark-theme .text-gray-400 { color: #9ca3af !important; }
        .dark-theme .border-gray-100, .dark-theme .border-gray-200 { border-color: #2d2d44 !important; }
        .dark-theme .bg-gray-50, .dark-theme .bg-gray-100 { background-color: #2d2d44 !important; }

        .search-input:focus { transform: scale(1.02); }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>

    <script>
        // Level Configuration
        const LEVEL_CONFIG = {
            1: { interval: 24, requiredStreak: 5, nextLevel: 2, fallbackLevel: 1, name: 'Başlangıç', color: '#3B82F6', bg: 'bg-blue-500' },
            2: { interval: 48, requiredStreak: 3, nextLevel: 3, fallbackLevel: 1, name: 'Orta Başlangıç', color: '#10B981', bg: 'bg-green-500' },
            3: { interval: 120, requiredStreak: 3, nextLevel: 4, fallbackLevel: 2, name: 'Orta', color: '#F59E0B', bg: 'bg-yellow-500' },
            4: { interval: 240, requiredStreak: 2, nextLevel: 5, fallbackLevel: 3, name: 'İleri', color: '#F97316', bg: 'bg-orange-500' },
            5: { interval: 360, requiredStreak: 2, nextLevel: 6, fallbackLevel: 4, name: 'Uzman', color: '#EF4444', bg: 'bg-red-500' },
            6: { interval: 0, requiredStreak: 0, nextLevel: 6, fallbackLevel: 5, name: 'Ezberlendi', color: '#8B5CF6', bg: 'bg-purple-500' }
        };

        const INITIAL_WORDS = [
            { id: '1', term: 'Apple', definition: 'Elma', level: 1, kademe: 0, nextReview: Date.now(), finishTime: null,
              image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300', synonyms: 'Elma', antonyms: '', exampleSentence: 'I eat an apple every day.' },
            { id: '2', term: 'Car', definition: 'Araba', level: 2, kademe: 1, nextReview: Date.now(), finishTime: null,
              image: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=300', synonyms: 'Vehicle, Automobile', antonyms: '', exampleSentence: 'My car is red.' },
            { id: '3', term: 'Beautiful', definition: 'Güzel', level: 3, kademe: 2, nextReview: Date.now(), finishTime: null,
              image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=300', synonyms: 'Pretty, Lovely, Attractive', antonyms: 'Ugly', exampleSentence: 'The sunset is beautiful.' },
            { id: '4', term: 'Fast', definition: 'Hızlı', level: 1, kademe: 2, nextReview: Date.now(), finishTime: null,
              image: 'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=300', synonyms: 'Quick, Rapid, Swift', antonyms: 'Slow', exampleSentence: 'He runs very fast.' },
            { id: '5', term: 'Computer', definition: 'Bilgisayar', level: 2, kademe: 0, nextReview: Date.now(), finishTime: null,
              image: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=300', synonyms: 'PC, Laptop', antonyms: '', exampleSentence: 'I work on my computer.' }
        ];

        let state = {
            words: [], activeTab: 'home', showQuiz: false, quizType: 'multiple-choice',
            currentQuestion: null, quizWords: [], quizIndex: 0, feedback: null,
            theme: 'light', showAddForm: false,
            showEditModal: false, showDetailModal: false,
            detailWord: null, editingWord: null, sortType: 'newest', quizHistory: [],
            writingAnswer: '', streakDays: 0, totalPoints: 0, searchQuery: '',
            newWord: { term: '', definition: '', image: '', synonyms: '', antonyms: '', exampleSentence: '' }
        };

        // Streak Hesaplama
        const calculateStreak = () => {
            if (!state.quizHistory.length) return 0;
            let uniqueDates = [...new Set(state.quizHistory.map(d => new Date(d).toDateString()))];
            uniqueDates.sort((a, b) => new Date(a) - new Date(b));
            let currentStreak = 0;
            for (let i = uniqueDates.length - 1; i >= 0; i--) {
                let expectedDate = new Date();
                expectedDate.setDate(expectedDate.getDate() - currentStreak);
                if (uniqueDates[i] === expectedDate.toDateString()) {
                    currentStreak++;
                } else {
                    break;
                }
            }
            return currentStreak;
        };

        const updateStreakFromHistory = () => {
            state.streakDays = calculateStreak();
            saveToLocalStorage();
        };

        const saveToLocalStorage = () => {
            localStorage.setItem('srs_words', JSON.stringify(state.words));
            localStorage.setItem('srs_theme', state.theme);
            localStorage.setItem('quiz_history', JSON.stringify(state.quizHistory));
            localStorage.setItem('total_points', state.totalPoints);
        };

        const loadFromLocalStorage = () => {
            const savedWords = localStorage.getItem('srs_words');
            state.words = savedWords ? JSON.parse(savedWords) : JSON.parse(JSON.stringify(INITIAL_WORDS));
            state.theme = localStorage.getItem('srs_theme') || 'light';
            state.quizHistory = localStorage.getItem('quiz_history') ? JSON.parse(localStorage.getItem('quiz_history')) : [];
            state.totalPoints = parseInt(localStorage.getItem('total_points')) || 0;
            state.streakDays = calculateStreak();
        };

        const addPoints = (points) => {
            state.totalPoints += points;
            saveToLocalStorage();
            render();
            const el = document.getElementById('points-display');
            if (el) { el.classList.add('animate-fire'); setTimeout(() => el.classList.remove('animate-fire'), 500); }
        };

        const getDueWords = () => {
            const now = Date.now();
            return state.words.filter(word => {
                if (word.level === 6) return false;
                return word.nextReview <= now;
            });
        };

        const updateWordAfterAnswer = (word, isCorrect) => {
            if (isCorrect) {
                let newKademe = word.kademe + 1;
                let config = LEVEL_CONFIG[word.level];
                addPoints(10);
                if (newKademe >= config.requiredStreak) {
                    let nextLevel = config.nextLevel;
                    addPoints(50);
                    if (nextLevel === 6) {
                        return { ...word, level: 6, kademe: 0, nextReview: Date.now(), finishTime: Date.now() };
                    } else {
                        return { ...word, level: nextLevel, kademe: 0, nextReview: Date.now() + (LEVEL_CONFIG[nextLevel].interval * 60 * 60 * 1000) };
                    }
                } else {
                    return { ...word, kademe: newKademe, nextReview: Date.now() + (config.interval * 60 * 60 * 1000) };
                }
            } else {
                if (word.level === 1) {
                    return { ...word, kademe: 0, nextReview: Date.now() + (LEVEL_CONFIG[1].interval * 60 * 60 * 1000) };
                } else {
                    let fallbackLevel = LEVEL_CONFIG[word.level].fallbackLevel;
                    return { ...word, level: fallbackLevel, kademe: 0, nextReview: Date.now() + (LEVEL_CONFIG[fallbackLevel].interval * 60 * 60 * 1000) };
                }
            }
        };

        const speakText = (text, lang = 'en') => {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Seslendirme desteklenmiyor');
            }
        };

        const generateDistractors = (correctWord) => {
            let otherWords = state.words.filter(w => w.id !== correctWord.id && w.level !== 6);
            let shuffled = [...otherWords].sort(() => Math.random() - 0.5);
            let distractors = shuffled.slice(0, 3).map(w => w.definition);
            while (distractors.length < 3) {
                distractors.push(`Anlam ${distractors.length + 1}`);
            }
            return distractors;
        };

        // Quiz Functions
        const generateMultipleChoiceQuestion = (wordsList, index) => {
            if (index >= wordsList.length) { nextQuizStage(); return; }
            let word = wordsList[index];
            let distractors = generateDistractors(word);
            let options = [...distractors, word.definition];
            let shuffled = options.sort(() => Math.random() - 0.5);
            state.currentQuestion = { word: word, options: shuffled, correctAnswer: word.definition, type: 'multiple-choice' };
            render();
        };

        const generateWritingQuestion = (wordsList, index) => {
            if (index >= wordsList.length) { finishQuiz(); return; }
            state.currentQuestion = { word: wordsList[index], correctAnswer: wordsList[index].term, type: 'writing' };
            state.writingAnswer = '';
            render();
        };

        const nextQuizStage = () => {
            if (state.quizType === 'multiple-choice') {
                state.quizType = 'writing';
                state.quizIndex = 0;
                generateWritingQuestion(state.quizWords, 0);
            } else {
                finishQuiz();
            }
        };

        const handleMultipleChoiceAnswer = (selected) => {
            if (!state.currentQuestion) return;
            let isCorrect = selected === state.currentQuestion.correctAnswer;
            state.feedback = { isCorrect, correctAnswer: state.currentQuestion.correctAnswer };
            let updated = updateWordAfterAnswer(state.currentQuestion.word, isCorrect);
            let idx = state.words.findIndex(w => w.id === updated.id);
            if (idx !== -1) state.words[idx] = updated;
            saveToLocalStorage();
            setTimeout(() => {
                state.feedback = null;
                let nextIdx = state.quizIndex + 1;
                if (nextIdx < state.quizWords.length) {
                    state.quizIndex = nextIdx;
                    generateMultipleChoiceQuestion(state.quizWords, nextIdx);
                } else {
                    nextQuizStage();
                }
                render();
            }, 1500);
            render();
        };

        const handleWritingAnswer = () => {
            if (!state.currentQuestion || !state.writingAnswer.trim()) {
                alert('Lütfen bir cevap yazın!');
                return;
            }
            let isCorrect = state.writingAnswer.trim().toLowerCase() === state.currentQuestion.correctAnswer.toLowerCase();
            state.feedback = { isCorrect, correctAnswer: state.currentQuestion.correctAnswer };
            let updated = updateWordAfterAnswer(state.currentQuestion.word, isCorrect);
            let idx = state.words.findIndex(w => w.id === updated.id);
            if (idx !== -1) state.words[idx] = updated;
            
            if (state.quizIndex === state.quizWords.length - 1 && state.quizType === 'writing') {
                let today = new Date().toDateString();
                if (!state.quizHistory.includes(today)) {
                    state.quizHistory.push(today);
                    updateStreakFromHistory();
                    addPoints(100);
                    saveToLocalStorage();
                }
            }
            saveToLocalStorage();
            setTimeout(() => {
                state.feedback = null;
                let nextIdx = state.quizIndex + 1;
                if (nextIdx < state.quizWords.length) {
                    state.quizIndex = nextIdx;
                    generateWritingQuestion(state.quizWords, nextIdx);
                } else {
                    finishQuiz();
                }
                render();
            }, 1500);
            render();
        };

        const startQuiz = () => {
            let due = getDueWords();
            if (due.length < 5) {
                alert('Sınav başlatmak için en az 5 kelimeye ihtiyacınız var!');
                return;
            }
            state.quizWords = [...due];
            state.quizIndex = 0;
            state.quizType = 'multiple-choice';
            state.showQuiz = true;
            generateMultipleChoiceQuestion(state.quizWords, 0);
        };

        const finishQuiz = () => {
            state.showQuiz = false;
            state.currentQuestion = null;
            state.quizWords = [];
            state.quizIndex = 0;
            state.feedback = null;
            state.quizType = 'multiple-choice';
            state.writingAnswer = '';
            render();
        };

        const addWord = () => {
            if (!state.newWord.term.trim() || !state.newWord.definition.trim()) {
                alert('Lütfen kelime ve anlamını girin!');
                return;
            }
            let newWord = {
                id: Date.now().toString(),
                term: state.newWord.term.trim(),
                definition: state.newWord.definition.trim(),
                level: 1,
                kademe: 0,
                nextReview: Date.now(),
                finishTime: null,
                image: state.newWord.image.trim(),
                synonyms: state.newWord.synonyms.trim(),
                antonyms: state.newWord.antonyms.trim(),
                exampleSentence: state.newWord.exampleSentence.trim()
            };
            state.words.unshift(newWord);
            state.newWord = { term: '', definition: '', image: '', synonyms: '', antonyms: '', exampleSentence: '' };
            state.showAddForm = false;
            saveToLocalStorage();
            render();
        };

        const updateWord = () => {
            if (!state.editingWord) return;
            let idx = state.words.findIndex(w => w.id === state.editingWord.id);
            if (idx !== -1) {
                state.words[idx] = { ...state.editingWord };
                saveToLocalStorage();
            }
            state.showEditModal = false;
            state.editingWord = null;
            render();
        };

        const deleteWord = (id) => {
            if (confirm('Bu kelimeyi silmek istediğinizden emin misiniz?')) {
                state.words = state.words.filter(w => w.id !== id);
                saveToLocalStorage();
                render();
            }
        };

        const openEditModal = (word) => {
            state.editingWord = { ...word };
            state.showEditModal = true;
            render();
        };

        const openDetailModal = (word) => {
            state.detailWord = { ...word };
            state.showDetailModal = true;
            render();
        };

        const exportData = () => {
            let a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(state.words, null, 2)], { type: 'application/json' }));
            a.download = `srs_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        };

        const importData = (e) => {
            let file = e.target.files[0];
            if (file) {
                let r = new FileReader();
                r.onload = ev => {
                    try {
                        let imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported)) {
                            state.words = imported;
                            saveToLocalStorage();
                            alert('Veriler başarıyla yüklendi!');
                            render();
                        } else {
                            alert('Geçersiz dosya formatı!');
                        }
                    } catch (err) {
                        alert('Dosya okunamadı!');
                    }
                };
                r.readAsText(file);
            }
        };

        const getFilteredAndSortedWords = () => {
            let filtered = [...state.words];
            if (state.searchQuery.trim()) {
                let q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(w => w.term.toLowerCase().includes(q) || w.definition.toLowerCase().includes(q));
            }
            switch (state.sortType) {
                case 'newest': return filtered.sort((a, b) => parseInt(b.id) - parseInt(a.id));
                case 'oldest': return filtered.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                case 'levelAsc': return filtered.sort((a, b) => a.level - b.level);
                case 'levelDesc': return filtered.sort((a, b) => b.level - a.level);
                default: return filtered;
            }
        };

        const getLevelStats = () => {
            let s = {};
            for (let i = 1; i <= 6; i++) s[i] = state.words.filter(w => w.level === i).length;
            return s;
        };

        const getNextReviewDate = (ts) => new Date(ts).toLocaleDateString('tr-TR');
        const getLevelColor = (l) => LEVEL_CONFIG[l]?.bg || 'bg-gray-500';
        const getLevelIcon = (l) => ({ 1: '🌱', 2: '🌿', 3: '🌟', 4: '⭐', 5: '🏆', 6: '👑' }[l] || '📚');
        const getStreakIcon = () => {
            let d = state.streakDays;
            if (d >= 30) return '🏆🔥';
            if (d >= 15) return '⚡🔥';
            if (d >= 7) return '🔥';
            if (d >= 3) return '📈';
            return '🌱';
        };

        // Render Functions
        const renderWordCard = (word, isMastered = false) => {
            return `<div class="word-card bg-white/90 backdrop-blur-sm rounded-2xl shadow-md overflow-hidden" onclick="window.openDetailModal(${JSON.stringify(word).replace(/"/g, '&quot;')})">
                <div class="p-4"><div class="flex justify-between items-start"><div class="flex-1"><div class="flex items-center gap-2 flex-wrap"><div class="font-bold text-lg text-gray-800">${word.term}</div><span class="px-2 py-0.5 rounded-full text-xs text-white ${getLevelColor(word.level)}">Lv${word.level}</span>${isMastered ? '<span class="px-2 py-0.5 rounded-full text-xs text-white bg-purple-500">✓ Ezberlendi</span>' : ''}<div class="flex gap-1"><button onclick="event.stopPropagation(); window.speakText('${word.term.replace(/'/g, "\\'")}', 'en')" class="speak-btn w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm">🔊</button><button onclick="event.stopPropagation(); window.speakText('${word.definition.replace(/'/g, "\\'")}', 'tr')" class="speak-btn w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm">🎤</button></div></div><div class="text-gray-600 text-sm mt-1">${word.definition}</div>${word.synonyms ? `<div class="text-xs text-green-600 mt-2">📖 Eş: ${word.synonyms}</div>` : ''}${word.antonyms ? `<div class="text-xs text-red-600">⚡ Zıt: ${word.antonyms}</div>` : ''}${word.exampleSentence ? `<div class="text-xs text-blue-600 italic mt-2">💬 "${word.exampleSentence.substring(0, 60)}${word.exampleSentence.length > 60 ? '...' : ''}"</div>` : ''}<div class="flex items-center gap-3 mt-2"><div class="flex items-center gap-1"><span class="text-xs text-gray-400">Kademe:</span><span class="text-xs font-medium">${word.kademe}/${LEVEL_CONFIG[word.level].requiredStreak}</span></div><div class="w-1 h-1 bg-gray-300 rounded-full"></div><div class="text-xs text-gray-400">📅 ${getNextReviewDate(word.nextReview)}</div></div></div><div class="flex gap-1"><button onclick="event.stopPropagation(); window.openEditModal(${JSON.stringify(word).replace(/"/g, '&quot;')})" class="w-8 h-8 rounded-full bg-gray-100 text-blue-500 flex items-center justify-center text-sm">✏️</button><button onclick="event.stopPropagation(); window.deleteWord('${word.id}')" class="w-8 h-8 rounded-full bg-gray-100 text-red-500 flex items-center justify-center text-sm">🗑️</button></div></div>${word.image ? `<img src="${word.image}" class="mt-3 rounded-xl w-full h-32 object-cover" onerror="this.style.display='none'">` : ''}</div></div>`;
        };

        const renderCalendar = () => {
            let today = new Date(), month = today.getMonth(), year = today.getFullYear();
            let firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0);
            let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            let days = [], quizDates = new Set(state.quizHistory);
            for (let i = 0; i < startOffset; i++) days.push(null);
            for (let d = 1; d <= lastDay.getDate(); d++) {
                let date = new Date(year, month, d);
                let has = quizDates.has(date.toDateString());
                let isToday = date.toDateString() === today.toDateString();
                days.push({ day: d, hasQuiz: has, isToday });
            }
            let monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
            let dayNames = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
            return `<div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-lg p-5"><h3 class="font-bold text-lg mb-4 text-center flex items-center justify-center gap-2"><span class="text-2xl">📅</span>${monthNames[month]} ${year}</h3><div class="grid grid-cols-7 gap-1 mb-2">${dayNames.map(d => `<div class="text-center text-xs font-semibold text-gray-500 py-1">${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${days.map(day => day === null ? '<div class="h-10"></div>' : `<div class="text-center"><div class="calendar-day inline-flex items-center justify-center w-9 h-9 rounded-full transition-all ${day.isToday ? 'bg-blue-500 text-white shadow-lg scale-110' : day.hasQuiz ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-700'}">${day.day}</div></div>`).join('')}</div><div class="flex justify-center gap-4 mt-4 text-xs"><div class="flex items-center gap-1"><div class="w-3 h-3 bg-green-500 rounded-full"></div><span>Sınav</span></div><div class="flex items-center gap-1"><div class="w-3 h-3 bg-blue-500 rounded-full"></div><span>Bugün</span></div></div></div>`;
        };

        const renderLevelProgress = () => {
            let stats = getLevelStats(), total = state.words.filter(w => w.level !== 6).length;

            if (!state.showDetailModal || !state.detailWord) return '';
            let word = state.detailWord, config = LEVEL_CONFIG[word.level];
            return `<div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4 modal-overlay animate-fade-in" onclick="window.closeDetailModal(event)"><div class="bg-white rounded-3xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto animate-scale-in" onclick="event.stopPropagation()"><div class="sticky top-0 bg-white rounded-t-3xl p-5 border-b border-gray-100"><div class="flex justify-between items-start"><div class="flex-1"><div class="flex items-center gap-2 mb-2"><span class="text-3xl">${getLevelIcon(word.level)}</span><span class="px-3 py-1 rounded-full text-xs font-semibold text-white ${config.bg}">Seviye ${word.level} • ${config.name}</span></div><div class="flex items-center gap-2 mt-2"><h2 class="text-3xl font-bold text-gray-800">${word.term}</h2><button onclick="window.speakText('${word.term.replace(/'/g, "\\'")}', 'en')" class="speak-btn w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">🔊</button></div></div><button onclick="window.closeDetailModal()" class="text-gray-400 hover:text-gray-600 text-2xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100">✕</button></div></div><div class="p-5 space-y-5">${word.image ? `<div class="rounded-2xl overflow-hidden"><img src="${word.image}" class="w-full h-64 object-cover"></div>` : `<div class="rounded-2xl bg-gradient-to-br from-blue-50 to-purple-50 p-8 text-center"><span class="text-6xl">📖</span><p class="text-gray-500 mt-2">Görsel eklenmemiş</p></div>`}<div class="bg-gray-50 rounded-2xl p-5"><div class="flex items-center gap-2 mb-2"><span class="text-xl">📝</span><h3 class="font-semibold text-gray-700">Anlamı</h3></div><p class="text-gray-800 text-lg">${word.definition}</p></div>${word.synonyms ? `<div class="bg-green-50 rounded-2xl p-5"><div class="flex items-center gap-2 mb-2"><span class="text-xl">📖</span><h3 class="font-semibold text-green-700">Eş Anlamlılar</h3></div><p class="text-green-800">${word.synonyms}</p></div>` : ''}${word.antonyms ? `<div class="bg-red-50 rounded-2xl p-5"><div class="flex items-center gap-2 mb-2"><span class="text-xl">⚡</span><h3 class="font-semibold text-red-700">Zıt Anlamlılar</h3></div><p class="text-red-800">${word.antonyms}</p></div>` : ''}${word.exampleSentence ? `<div class="bg-blue-50 rounded-2xl p-5"><div class="flex items-center gap-2 mb-2"><span class="text-xl">💬</span><h3 class="font-semibold text-blue-700">Örnek Cümle</h3></div><p class="text-blue-800 italic">"${word.exampleSentence}"</p><button onclick="window.speakText('${word.exampleSentence.replace(/'/g, "\\'")}', 'en')" class="mt-3 text-sm text-blue-600 flex items-center gap-1 hover:underline">🔊 Cümleyi dinle</button></div>` : ''}<div class="flex items-center justify-between pt-3 border-t border-gray-100"><div class="text-sm text-gray-500"><div>Kademe: ${word.kademe}/${config.requiredStreak}</div><div>Sonraki tekrar: ${getNextReviewDate(word.nextReview)}</div></div><div class="flex gap-2"><button onclick="window.openEditModalFromDetail()" class="px-4 py-2 bg-blue-500 text-white rounded-xl text-sm font-semibold">✏️ Düzenle</button><button onclick="window.deleteWordFromDetail()" class="px-4 py-2 bg-red-500 text-white rounded-xl text-sm font-semibold">🗑️ Sil</button></div></div></div></div></div>`;
        };

        // Global functions
        window.startQuiz = startQuiz;
        window.finishQuiz = finishQuiz;
        window.handleMultipleChoiceAnswer = handleMultipleChoiceAnswer;
        window.handleWritingAnswer = handleWritingAnswer;
        window.switchTab = (t) => { state.activeTab = t; render(); };
        window.toggleAddForm = (v) => { state.showAddForm = v; render(); };
        window.addWord = addWord;
        window.deleteWord = deleteWord;
        window.openEditModal = openEditModal;
        window.openDetailModal = openDetailModal;
        window.closeDetailModal = (e) => { if (!e || e.target === e.currentTarget) { state.showDetailModal = false; state.detailWord = null; render(); } };
        window.openEditModalFromDetail = () => { if (state.detailWord) { let w = state.detailWord; state.showDetailModal = false; openEditModal(w); } };
        window.deleteWordFromDetail = () => { if (state.detailWord) { let id = state.detailWord.id; state.showDetailModal = false; deleteWord(id); } };
        window.closeEditModal = (e) => { if (!e || e.target === e.currentTarget) { state.showEditModal = false; state.editingWord = null; render(); } };
        window.saveEdit = () => {
            let term = document.getElementById('editTerm')?.value;
            let def = document.getElementById('editDefinition')?.value;
            let img = document.getElementById('editImage')?.value;
            let syn = document.getElementById('editSynonyms')?.value;
            let ant = document.getElementById('editAntonyms')?.value;
            let ex = document.getElementById('editExample')?.value;
            if (state.editingWord) {
                state.editingWord.term = term;
                state.editingWord.definition = def;
                state.editingWord.image = img;
                state.editingWord.synonyms = syn;
                state.editingWord.antonyms = ant;
                state.editingWord.exampleSentence = ex;
                updateWord();
            }
        };
        window.exportData = exportData;
        window.importData = (input) => importData({ target: input });
        window.setTheme = (t) => { state.theme = t; saveToLocalStorage(); render(); if (t === 'dark') document.body.classList.add('dark-theme'); else document.body.classList.remove('dark-theme'); };
        window.changeSortType = (t) => { state.sortType = t; render(); };
        window.speakText = speakText;
        window.searchWords = (q) => { state.searchQuery = q; render(); };
        window.clearSearch = () => { state.searchQuery = ''; let inp = document.getElementById('searchInput'); if (inp) inp.value = ''; render(); };

        window.syncInputs = () => {
            let t = document.getElementById('newTerm'), d = document.getElementById('newDefinition'), i = document.getElementById('newImage');
            let s = document.getElementById('newSynonyms'), a = document.getElementById('newAntonyms'), e = document.getElementById('newExample');
            if (t) state.newWord.term = t.value;
            if (d) state.newWord.definition = d.value;
            if (i) state.newWord.image = i.value;
            if (s) state.newWord.synonyms = s.value;
            if (a) state.newWord.antonyms = a.value;
            if (e) state.newWord.exampleSentence = e.value;
        };
        window.syncWritingAnswer = () => { let a = document.getElementById('writingAnswer'); if (a) state.writingAnswer = a.value; };
        setInterval(() => {
            if (state.showAddForm) window.syncInputs();
            if (state.showQuiz && state.quizType === 'writing') window.syncWritingAnswer();
        }, 100);

        const render = () => {
            document.getElementById('app').innerHTML = renderMain() + renderEditModal() + renderDetailModal();
        };

        loadFromLocalStorage();
        if (state.theme === 'dark') document.body.classList.add('dark-theme');
        render();
    </script>
</body>
</html>
